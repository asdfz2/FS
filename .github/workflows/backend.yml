name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - "FS.sql"
      - "sql/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "back/**"
      - "FS.sql"
      - "sql/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back/pom.xml
      - run: mvn -B -Dmaven.test.skip=false test
      - run: mvn -B -DskipTests package

  mysql-integration:
    needs: backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: back
    env:
      RUN_MYSQL_IT: "true"
      DB_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/fs?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back/pom.xml
      # ubuntu-latest 现为 Ubuntu 26（2026-10-19 迁移），apt 里 mysql-client 会连带拉起
      # 配置失败的 mysql-server 包；直接用服务容器同款镜像里的客户端导 FS.sql
      - name: Initialize database
        run: docker run --rm --interactive --network host mysql:8.0 mysql --default-character-set=utf8mb4 -h127.0.0.1 -P3306 -uroot -proot fs < ../FS.sql
      - name: Run MySQL API integration tests
        run: mvn -B -Dmaven.test.skip=false -Dtest=MySqlApiIntegrationTests test
