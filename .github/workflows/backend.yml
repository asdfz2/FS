name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - "FS.sql"
      - "sql/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "back/**"
      - "FS.sql"
      - "sql/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back/pom.xml
      - run: mvn -B -Dmaven.test.skip=false test
      - run: mvn -B -DskipTests package

  mysql-integration:
    needs: backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: back
    env:
      RUN_MYSQL_IT: "true"
      DB_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/fs?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back/pom.xml
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Initialize database
        run: mysql -h127.0.0.1 -P3306 -uroot -proot fs < ../FS.sql
      - name: Run MySQL API integration tests
        run: mvn -B -Dmaven.test.skip=false -Dtest=MySqlApiIntegrationTests test
