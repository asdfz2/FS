server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 入口 HTML 每次重新验证（避免浏览器拿旧 index.html 引用已被覆盖的资源）
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }
    # 带 hash 的静态资源长期强缓存（Vite 已自动指纹化，文件不变 URL 就不变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # favicon 等其他根目录静态资源不缓存
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp)$ {
        add_header Cache-Control "no-cache" always;
    }

    # 后端 Spring Boot（context-path=/api）
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    # Vue hash 路由，其余请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
